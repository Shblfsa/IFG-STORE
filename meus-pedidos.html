<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - IFG STORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="IFG.png" width="65" alt="Logo IFG"> IFG STORE
                </a>
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                        <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
                    </ul>
                    <a href="carrinho.html" class="nav-link text-white me-4">
                        <i id="iconeCarrinho" class="bi bi-cart fs-4"></i>
                        <span id="contadorCarrinho" class="badge bg-danger">0</span>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-outline-light dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle fs-4"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" id="menuUsuario"></ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <h1 class="mb-4">
            <i class="bi bi-bag-check"></i> Meus Pedidos
        </h1>

        <div id="listaPedidos"></div>

        <a href="produtos.html" class="btn btn-success mt-3">
            Voltar aos Produtos
        </a>
    </main>

    <footer class="rodape text-center">
        <a href="https://www.facebook.com">Facebook</a>
        <a href="https://www.instagram.com">Instagram</a>
        <a href="https://www.tiktok.com">TikTok</a>
        <p>© 2026 - IFG STORE</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const produtos = [
            {id: 1, nome: "Notebook DELL - 8 GB"},
            {id: 2, nome: "Notebook DELL - 16 GB"},
            {id: 3, nome: "Notebook DELL - 32 GB"}
        ];

        let usuario = JSON.parse(localStorage.getItem("usuarioLogado") || "null");

        function mostrarPedidos() {
            if (!usuario) {
                window.location.href = "login.html";
                return;
            }

            let pedidos = JSON.parse(localStorage.getItem("pedidos") || "[]");
            let lista = document.getElementById("listaPedidos");

            pedidos = pedidos.filter(p => p.email === usuario.email);

            if (pedidos.length === 0) {
                lista.innerHTML = `
                    <div class="alert alert-info">
                        Você ainda não possui pedidos.
                    </div>
                `;
                return;
            }

            pedidos.forEach(function (pedido, indice) {
                let itensHTML = "";

                pedido.itens.forEach(function (item) {
                    let produto = produtos.find(p => p.id === item.id);

                    if (produto) {
                        itensHTML += `
                            <li>${produto.nome} - ${item.quantidade} unidade(s)</li>
                        `;
                    }
                });

                let total = pedido.total.toLocaleString("pt-BR", {
                    style: "currency",
                    currency: "BRL"
                });

                lista.innerHTML += `
                    <div class="card shadow-sm mb-3">
                        <div class="card-body">
                            <h5>Pedido ${indice + 1}</h5>
                            <p>Data: ${pedido.data}</p>
                            <ul>${itensHTML}</ul>
                            <strong class="text-success">Total: ${total}</strong>
                        </div>
                    </div>
                `;
            });
        }

        function atualizarMenuUsuario() {
            document.getElementById("menuUsuario").innerHTML = usuario ? `
                <li><a class="dropdown-item" href="meus-dados.html">Meus Dados</a></li>
                <li><a class="dropdown-item" href="meus-pedidos.html">Meus Pedidos</a></li>
                <li><button class="dropdown-item" onclick="sair()">Sair</button></li>
            ` : `
                <li><a class="dropdown-item" href="novo_usuario.html">Cadastrar</a></li>
                <li><a class="dropdown-item" href="login.html">Entrar</a></li>
            `;
        }

        function atualizarCarrinho() {
            let carrinho = JSON.parse(localStorage.getItem("carrinho") || "[]");
            let quantidade = carrinho.reduce((soma, item) => soma + item.quantidade, 0);
            document.getElementById("contadorCarrinho").textContent = quantidade;
            document.getElementById("iconeCarrinho").className =
                quantidade > 0 ? "bi bi-cart-fill fs-4" : "bi bi-cart fs-4";
        }

        function sair() {
            localStorage.removeItem("usuarioLogado");
            window.location.href = "index.html";
        }

        atualizarMenuUsuario();
        atualizarCarrinho();
        mostrarPedidos();
    </script>
</body>

</html>
