
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes do Pedido | IFG STORE</title>
    <link rel="icon" href="favicon (1).ico">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="IFG.png" alt="IFG" width="55"> IFG STORE
            </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
                </ul>

                <a href="carrinho.html" class="text-white text-decoration-none me-4">
                    <i id="iconeCarrinho" class="bi bi-cart fs-4"></i>
                    <span id="contadorCarrinho" class="badge bg-danger">0</span>
                </a>

                <div class="dropdown">
                    <button class="btn btn-outline-light dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end" id="menuUsuario"></ul>
                </div>
            </div>
        </div>
    </nav>
</header>

<main class="container py-4 flex-grow-1">

    <h1 class="mb-4">Detalhes do pedido</h1>

    <div id="detalhesPedido"></div>

    <a href="meus_pedidos.html" class="btn btn-outline-secondary mt-3">
        Voltar aos pedidos
    </a>

</main>

<footer class="rodape text-center mt-auto">
    <a href="https://www.facebook.com">Facebook</a>
    <a href="https://www.instagram.com">Instagram</a>
    <a href="https://www.tiktok.com">TikTok</a>
    <p class="mb-0 mt-2">© 2026 - IFG STORE</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    function ler(chave, padrao) {
        const dados = localStorage.getItem(chave);

        if (dados === null) {
            return padrao;
        }

        try {
            return JSON.parse(dados);
        } catch (erro) {
            return padrao;
        }
    }

    function moeda(valor) {
        return Number(valor).toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        });
    }

    function textoSeguro(valor) {
        let texto = String(valor);

        texto = texto.replace(/&/g, "&amp;");
        texto = texto.replace(/</g, "&lt;");
        texto = texto.replace(/>/g, "&gt;");
        texto = texto.replace(/"/g, "&quot;");
        texto = texto.replace(/'/g, "&#39;");

        return texto;
    }

    function sair() {
        localStorage.removeItem("usuarioLogado");
        window.location.href = "index.html";
    }

    function atualizarCabecalho() {
        const usuario = ler("usuarioLogado", null);
        const menu = document.getElementById("menuUsuario");

        if (usuario !== null) {
            menu.innerHTML =
                '<li><a class="dropdown-item" href="dados_pessoais.html">Meus Dados</a></li>' +
                '<li><a class="dropdown-item" href="meus_pedidos.html">Meus Pedidos</a></li>' +
                '<li><button class="dropdown-item" onclick="sair()">Sair</button></li>';
        } else {
            menu.innerHTML =
                '<li><a class="dropdown-item" href="login.html">Entrar</a></li>' +
                '<li><a class="dropdown-item" href="novo_usuario.html">Cadastrar</a></li>';
        }

        const carrinho = ler("carrinho", []);
        let quantidade = 0;

        for (let i = 0; i < carrinho.length; i++) {
            quantidade = quantidade + Number(carrinho[i].quantidade);
        }

        document.getElementById("contadorCarrinho").textContent = quantidade;

        if (quantidade > 0) {
            document.getElementById("iconeCarrinho").className =
                "bi bi-cart-fill fs-4";
        } else {
            document.getElementById("iconeCarrinho").className =
                "bi bi-cart fs-4";
        }
    }

    // PROCURAR UM PEDIDO PELO PROTOCOLO

    function renderizarDetalhes() {
        const usuario = ler("usuarioLogado", null);

        if (usuario === null) {
            window.location.href = "login.html";
            return;
        }

        const parametros = new URLSearchParams(window.location.search);
        const protocolo = parametros.get("id");

        const pedidos = ler("pedidos", []);

        let pedidoEncontrado = null;

        for (let i = 0; i < pedidos.length; i++) {
            if (pedidos[i].protocolo === protocolo &&
                pedidos[i].email === usuario.email) {

                pedidoEncontrado = pedidos[i];
                break;
            }
        }

        const painel = document.getElementById("detalhesPedido");

        if (pedidoEncontrado === null) {
            painel.innerHTML =
                '<div class="alert alert-warning">' +
                'Pedido não encontrado.</div>';
            return;
        }

        // MOSTRAR OS ITENS DO PEDIDO

        let itensHTML = "";

        const itens = pedidoEncontrado.itens;

        for (let i = 0; i < itens.length; i++) {
            itensHTML = itensHTML +
                '<li class="list-group-item">' +
                textoSeguro(itens[i].nome) + " - " +
                Number(itens[i].quantidade) + "x - " +
                moeda(itens[i].preco * itens[i].quantidade) +
                '</li>';
        }

        painel.innerHTML =
            '<div class="card shadow-sm">' +
                '<div class="card-body">' +

                    '<h2 class="h5">Protocolo: ' +
                    textoSeguro(pedidoEncontrado.protocolo) + '</h2>' +

                    '<p>Status: ' +
                    textoSeguro(pedidoEncontrado.status) + '</p>' +

                    '<p>Data: ' +
                    textoSeguro(pedidoEncontrado.data) + '</p>' +

                    '<p>CEP: ' +
                    textoSeguro(pedidoEncontrado.cep) + '</p>' +

                    '<p>Pagamento: ' +
                    textoSeguro(pedidoEncontrado.metodoPagamento) + '</p>' +

                    '<p>Total de itens: ' +
                    Number(pedidoEncontrado.totalItens) + '</p>' +

                    '<h3 class="h6">Produtos</h3>' +

                    '<ul class="list-group mb-3">' +
                    itensHTML +
                    '</ul>' +

                    '<p>Valor dos produtos: ' +
                    moeda(pedidoEncontrado.valorProdutos) + '</p>' +

                    '<p>Frete: ' +
                    moeda(pedidoEncontrado.frete) + '</p>' +

                    '<p>Desconto: ' +
                    moeda(pedidoEncontrado.desconto) + '</p>' +

                    '<p class="fw-bold">Valor final: ' +
                    moeda(pedidoEncontrado.valorFinal) + '</p>' +

                '</div>' +
            '</div>';
    }

    atualizarCabecalho();
    renderizarDetalhes();

</script>

</body>
</html>
