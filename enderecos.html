
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meus Endereços | IFG STORE</title>
    <link rel="icon" href="favicon (1).ico">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="IFG.png" alt="IFG" width="55"> IFG STORE
            </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
                </ul>

                <a href="carrinho.html" class="text-white text-decoration-none me-4">
                    <i id="iconeCarrinho" class="bi bi-cart fs-4"></i>
                    <span id="contadorCarrinho" class="badge bg-danger">0</span>
                </a>

                <div class="dropdown">
                    <button class="btn btn-outline-light dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end" id="menuUsuario"></ul>
                </div>
            </div>
        </div>
    </nav>
</header>

<main class="container py-4 flex-grow-1">

    <h1 class="mb-4">Meus endereços</h1>

    <button class="btn btn-success mb-3"
            data-bs-toggle="modal" data-bs-target="#modalEndereco">

        <i class="bi bi-plus-circle"></i>
        Cadastrar Novo Endereço
    </button>

    <div id="listaEnderecos"></div>

    <a href="dados_pessoais.html" class="btn btn-outline-secondary mt-2">
        Voltar aos meus dados
    </a>

    <!-- MODAL DO BOOTSTRAP -->

    <div class="modal fade" id="modalEndereco" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h2 class="modal-title fs-5">
                        Cadastrar endereço
                    </h2>

                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal"></button>
                </div>

                <form id="formEndereco">

                    <div class="modal-body">

                        <label class="form-label" for="ruaEndereco">Rua</label>
                        <input class="form-control mb-3"
                               id="ruaEndereco" required>

                        <label class="form-label" for="numeroEndereco">Número</label>
                        <input class="form-control mb-3"
                               id="numeroEndereco" required>

                        <label class="form-label" for="cepEndereco">CEP</label>
                        <input class="form-control mb-3"
                               id="cepEndereco"
                               placeholder="99999-999"
                               maxlength="9" required>

                        <label class="form-label" for="cidadeEstadoEndereco">
                            Cidade/Estado
                        </label>

                        <input class="form-control"
                               id="cidadeEstadoEndereco"
                               placeholder="Cidade/UF" required>

                        <p id="mensagemEndereco" class="text-danger mt-2"></p>
                    </div>

                    <div class="modal-footer">

                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Fechar
                        </button>

                        <button type="submit" class="btn btn-success">
                            Salvar endereço
                        </button>

                    </div>

                </form>
            </div>
        </div>
    </div>

</main>

<footer class="rodape text-center mt-auto">
    <a href="https://www.facebook.com">Facebook</a>
    <a href="https://www.instagram.com">Instagram</a>
    <a href="https://www.tiktok.com">TikTok</a>
    <p class="mb-0 mt-2">© 2026 - IFG STORE</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    function ler(chave, padrao) {
        const dados = localStorage.getItem(chave);

        if (dados === null) {
            return padrao;
        }

        try {
            return JSON.parse(dados);
        } catch (erro) {
            return padrao;
        }
    }

    function gravar(chave, valor) {
        localStorage.setItem(chave, JSON.stringify(valor));
    }

    function textoSeguro(valor) {
        let texto = String(valor);

        texto = texto.replace(/&/g, "&amp;");
        texto = texto.replace(/</g, "&lt;");
        texto = texto.replace(/>/g, "&gt;");
        texto = texto.replace(/"/g, "&quot;");
        texto = texto.replace(/'/g, "&#39;");

        return texto;
    }

    function sair() {
        localStorage.removeItem("usuarioLogado");
        window.location.href = "index.html";
    }

    function atualizarCabecalho() {
        const usuario = ler("usuarioLogado", null);
        const menu = document.getElementById("menuUsuario");

        if (usuario !== null) {
            menu.innerHTML =
                '<li><a class="dropdown-item" href="dados_pessoais.html">Meus Dados</a></li>' +
                '<li><a class="dropdown-item" href="meus_pedidos.html">Meus Pedidos</a></li>' +
                '<li><button class="dropdown-item" onclick="sair()">Sair</button></li>';
        } else {
            menu.innerHTML =
                '<li><a class="dropdown-item" href="login.html">Entrar</a></li>' +
                '<li><a class="dropdown-item" href="novo_usuario.html">Cadastrar</a></li>';
        }

        const carrinho = ler("carrinho", []);
        let quantidade = 0;

        for (let i = 0; i < carrinho.length; i++) {
            quantidade = quantidade + Number(carrinho[i].quantidade);
        }

        document.getElementById("contadorCarrinho").textContent = quantidade;

        if (quantidade > 0) {
            document.getElementById("iconeCarrinho").className =
                "bi bi-cart-fill fs-4";
        } else {
            document.getElementById("iconeCarrinho").className =
                "bi bi-cart fs-4";
        }
    }

    // CHAVE UTILIZADA PARA SALVAR OS ENDEREÇOS DO USUÁRIO

    function chaveEnderecos() {
        const usuario = ler("usuarioLogado", null);

        return "enderecos_" + usuario.email;
    }

    // MOSTRAR OS ENDEREÇOS CADASTRADOS

    function renderizarEnderecos() {
        const lista = document.getElementById("listaEnderecos");
        const enderecos = ler(chaveEnderecos(), []);

        lista.innerHTML = "";

        if (enderecos.length === 0) {
            lista.innerHTML =
                '<div class="alert alert-info">' +
                'Você ainda não possui endereços cadastrados.</div>';
            return;
        }

        for (let i = 0; i < enderecos.length; i++) {
            const endereco = enderecos[i];

            const card = document.createElement("div");
            card.className = "card mb-3 shadow-sm";

            card.innerHTML =
                '<div class="card-body">' +

                    '<p><strong>Rua:</strong> ' +
                    textoSeguro(endereco.rua) + '</p>' +

                    '<p><strong>Número:</strong> ' +
                    textoSeguro(endereco.numero) + '</p>' +

                    '<p><strong>CEP:</strong> ' +
                    textoSeguro(endereco.cep) + '</p>' +

                    '<p><strong>Cidade/Estado:</strong> ' +
                    textoSeguro(endereco.cidadeEstado) + '</p>' +

                    '<input type="hidden" class="id-endereco" ' +
                    'value="' + textoSeguro(endereco.id) + '">' +

                    '<button class="btn btn-outline-danger btn-sm" ' +
                    'onclick="excluirEndereco(this)">' +
                    'Excluir Endereço</button>' +

                '</div>';

            lista.appendChild(card);
        }
    }

    // EXCLUIR UM ENDEREÇO PELO ID

    function excluirEndereco(botao) {
        const card = botao.parentElement;

        const id = card.querySelector(".id-endereco").value;

        if (!confirm("Deseja excluir este endereço?")) {
            return;
        }

        const enderecos = ler(chaveEnderecos(), []);

        for (let i = 0; i < enderecos.length; i++) {
            if (String(enderecos[i].id) === id) {
                enderecos.splice(i, 1);
                break;
            }
        }

        gravar(chaveEnderecos(), enderecos);
        renderizarEnderecos();
    }

    // FORMATAR CEP

    function formatarCep(cep) {
        const numeros = cep.replace(/\D/g, "");

        if (numeros.length === 8) {
            return numeros.substring(0, 5) + "-" +
                   numeros.substring(5);
        }

        return cep.trim();
    }

    // CADASTRAR UM NOVO ENDEREÇO

    document.getElementById("formEndereco").addEventListener(
        "submit",
        function(evento) {
            evento.preventDefault();

            const rua =
                document.getElementById("ruaEndereco").value.trim();

            const numero =
                document.getElementById("numeroEndereco").value.trim();

            const cep = formatarCep(
                document.getElementById("cepEndereco").value
            );

            const cidadeEstado =
                document.getElementById("cidadeEstadoEndereco").value.trim();

            if (!/^\d{5}-\d{3}$/.test(cep)) {
                document.getElementById("mensagemEndereco").textContent =
                    "Informe um CEP válido.";
                return;
            }

            const enderecos = ler(chaveEnderecos(), []);

            const novoEndereco = {
                id: String(Date.now()),
                rua: rua,
                numero: numero,
                cep: cep,
                cidadeEstado: cidadeEstado
            };

            enderecos.push(novoEndereco);

            gravar(chaveEnderecos(), enderecos);

            document.getElementById("formEndereco").reset();

            document.getElementById("mensagemEndereco").textContent = "";

            const modal = document.getElementById("modalEndereco");

            bootstrap.Modal.getOrCreateInstance(modal).hide();

            renderizarEnderecos();
        }
    );

    atualizarCabecalho();

    const usuarioLogado = ler("usuarioLogado", null);

    if (usuarioLogado === null) {
        window.location.href = "login.html";
    } else {
        renderizarEnderecos();
    }

</script>

</body>
</html>
