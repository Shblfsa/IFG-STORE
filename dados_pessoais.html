
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meus Dados | IFG STORE</title>
    <link rel="icon" href="favicon (1).ico">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="IFG.png" alt="IFG" width="55"> IFG STORE
            </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
                </ul>

                <a href="carrinho.html" class="text-white text-decoration-none me-4">
                    <i id="iconeCarrinho" class="bi bi-cart fs-4"></i>
                    <span id="contadorCarrinho" class="badge bg-danger">0</span>
                </a>

                <div class="dropdown">
                    <button class="btn btn-outline-light dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end" id="menuUsuario"></ul>
                </div>
            </div>
        </div>
    </nav>
</header>

<main class="container py-4 flex-grow-1">

    <h1 class="mb-4">Meus dados</h1>

    <div class="card form-card shadow-sm">
        <div class="card-body">

            <form id="formDados" novalidate>

                <label class="form-label" for="nomeDados">
                    Nome completo
                </label>

                <input class="form-control mb-3" id="nomeDados">

                <label class="form-label" for="emailDados">
                    E-mail
                </label>

                <input class="form-control mb-3" type="email" id="emailDados">

                <button class="btn btn-success">
                    Alterar meus dados
                </button>

                <p id="mensagemDados" class="mt-3" role="alert"></p>

            </form>

            <hr>

            <a href="enderecos.html" class="btn btn-outline-success">
                <i class="bi bi-geo-alt"></i> Meus Endereços
            </a>

        </div>
    </div>

</main>

<footer class="rodape text-center mt-auto">
    <a href="https://www.facebook.com">Facebook</a>
    <a href="https://www.instagram.com">Instagram</a>
    <a href="https://www.tiktok.com">TikTok</a>
    <p class="mb-0 mt-2">© 2026 - IFG STORE</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    const API_URL = "https://ppw-1-tads.vercel.app";

    function ler(chave, padrao) {
        const dados = localStorage.getItem(chave);

        if (dados === null) {
            return padrao;
        }

        try {
            return JSON.parse(dados);
        } catch (erro) {
            return padrao;
        }
    }

    function gravar(chave, valor) {
        localStorage.setItem(chave, JSON.stringify(valor));
    }

    function sair() {
        localStorage.removeItem("usuarioLogado");
        window.location.href = "index.html";
    }

    function atualizarCabecalho() {
        const usuario = ler("usuarioLogado", null);
        const menu = document.getElementById("menuUsuario");

        if (usuario !== null) {
            menu.innerHTML =
                '<li><a class="dropdown-item" href="dados_pessoais.html">Meus Dados</a></li>' +
                '<li><a class="dropdown-item" href="meus_pedidos.html">Meus Pedidos</a></li>' +
                '<li><button class="dropdown-item" onclick="sair()">Sair</button></li>';
        } else {
            menu.innerHTML =
                '<li><a class="dropdown-item" href="login.html">Entrar</a></li>' +
                '<li><a class="dropdown-item" href="novo_usuario.html">Cadastrar</a></li>';
        }

        const carrinho = ler("carrinho", []);
        let quantidade = 0;

        for (let i = 0; i < carrinho.length; i++) {
            quantidade = quantidade + Number(carrinho[i].quantidade);
        }

        document.getElementById("contadorCarrinho").textContent = quantidade;

        if (quantidade > 0) {
            document.getElementById("iconeCarrinho").className =
                "bi bi-cart-fill fs-4";
        } else {
            document.getElementById("iconeCarrinho").className =
                "bi bi-cart fs-4";
        }
    }

    // MOSTRAR OS DADOS DO USUÁRIO

    function carregarDados() {
        const usuario = ler("usuarioLogado", null);

        if (usuario === null) {
            window.location.href = "login.html";
            return;
        }

        document.getElementById("nomeDados").value = usuario.nome;
        document.getElementById("emailDados").value = usuario.email;
    }

    // ALTERAR OS DADOS PELA API

    document.getElementById("formDados").addEventListener(
        "submit",
        async function(evento) {
            evento.preventDefault();

            const nome = document.getElementById("nomeDados").value.trim();
            const email = document.getElementById("emailDados").value.trim();

            const mensagem = document.getElementById("mensagemDados");

            const usuario = ler("usuarioLogado", null);

            if (usuario === null) {
                window.location.href = "login.html";
                return;
            }

            const emailAntigo = usuario.email;

            mensagem.className = "text-muted mt-3";
            mensagem.textContent = "Alterando dados...";

            try {
                const resposta = await fetch(API_URL + "/api/user", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nome: nome,
                        email: email
                    })
                });

                const dados = await resposta.json();

                if (resposta.status === 400) {
                    mensagem.className = "text-danger mt-3";
                    mensagem.textContent = dados.mensagem;

                } else if (resposta.status === 409) {
                    mensagem.className = "text-danger mt-3";
                    mensagem.textContent =
                        "Este e-mail já está em uso.";

                } else if (resposta.status === 200) {

                    // ATUALIZAR O USUÁRIO LOGADO

                    usuario.nome = dados.dados.nome;
                    usuario.email = dados.dados.email;

                    gravar("usuarioLogado", usuario);

                    // ATUALIZAR O E-MAIL DOS PEDIDOS

                    const pedidos = ler("pedidos", []);

                    for (let i = 0; i < pedidos.length; i++) {
                        if (pedidos[i].email === emailAntigo) {
                            pedidos[i].email = usuario.email;
                        }
                    }

                    gravar("pedidos", pedidos);

                    const ultimoPedido = ler("ultimoPedido", null);

                    if (ultimoPedido !== null) {
                        if (ultimoPedido.email === emailAntigo) {
                            ultimoPedido.email = usuario.email;
                            gravar("ultimoPedido", ultimoPedido);
                        }
                    }

                    // MANTER OS ENDEREÇOS DO USUÁRIO

                    if (emailAntigo !== usuario.email) {
                        const enderecos = ler(
                            "enderecos_" + emailAntigo,
                            []
                        );

                        gravar(
                            "enderecos_" + usuario.email,
                            enderecos
                        );

                        localStorage.removeItem(
                            "enderecos_" + emailAntigo
                        );
                    }

                    mensagem.className = "text-success mt-3";
                    mensagem.textContent =
                        "Dados alterados com sucesso!";

                    carregarDados();

                } else {
                    mensagem.className = "text-danger mt-3";
                    mensagem.textContent =
                        "Erro HTTP " + resposta.status;
                }

            } catch (erro) {
                mensagem.className = "text-danger mt-3";
                mensagem.textContent =
                    "Erro de conexão com a API.";
            }
        }
    );

    atualizarCabecalho();
    carregarDados();

</script>

</body>
</html>
