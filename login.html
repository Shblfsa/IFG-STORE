
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | IFG STORE</title>
    <link rel="icon" href="favicon (1).ico">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="IFG.png" alt="IFG" width="55"> IFG STORE
            </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
                </ul>

                <a href="carrinho.html" class="text-white text-decoration-none me-4">
                    <i id="iconeCarrinho" class="bi bi-cart fs-4"></i>
                    <span id="contadorCarrinho" class="badge bg-danger">0</span>
                </a>

                <div class="dropdown">
                    <button class="btn btn-outline-light dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end" id="menuUsuario"></ul>
                </div>
            </div>
        </div>
    </nav>
</header>

<main class="container py-4 flex-grow-1">
    <div class="card form-card shadow-sm mx-auto">
        <div class="card-body">

            <h1 class="h3 mb-3">Login</h1>

            <form id="formLogin" novalidate>

                <label class="form-label" for="email">E-mail</label>
                <input class="form-control mb-3" type="email" id="email">

                <label class="form-label" for="senha">Senha</label>
                <input class="form-control mb-3" type="password" id="senha">

                <p id="mensagemLogin" class="text-danger" role="alert"></p>

                <button class="btn btn-success w-100">
                    Login
                </button>

            </form>
        </div>
    </div>
</main>

<footer class="rodape text-center mt-auto">
    <a href="https://www.facebook.com">Facebook</a>
    <a href="https://www.instagram.com">Instagram</a>
    <a href="https://www.tiktok.com">TikTok</a>
    <p class="mb-0 mt-2">© 2026 - IFG STORE</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    const API_URL = "https://ppw-1-tads.vercel.app";

    function ler(chave, padrao) {
        const dados = localStorage.getItem(chave);

        if (dados === null) {
            return padrao;
        }

        try {
            return JSON.parse(dados);
        } catch (erro) {
            return padrao;
        }
    }

    function sair() {
        localStorage.removeItem("usuarioLogado");
        window.location.href = "index.html";
    }

    function atualizarCabecalho() {
        const usuario = ler("usuarioLogado", null);
        const menu = document.getElementById("menuUsuario");

        if (usuario !== null) {
            menu.innerHTML =
                '<li><a class="dropdown-item" href="dados_pessoais.html">Meus Dados</a></li>' +
                '<li><a class="dropdown-item" href="meus_pedidos.html">Meus Pedidos</a></li>' +
                '<li><button class="dropdown-item" onclick="sair()">Sair</button></li>';
        } else {
            menu.innerHTML =
                '<li><a class="dropdown-item" href="login.html">Entrar</a></li>' +
                '<li><a class="dropdown-item" href="novo_usuario.html">Cadastrar</a></li>';
        }

        const carrinho = ler("carrinho", []);
        let quantidade = 0;

        for (let i = 0; i < carrinho.length; i++) {
            quantidade = quantidade + Number(carrinho[i].quantidade);
        }

        document.getElementById("contadorCarrinho").textContent = quantidade;

        if (quantidade > 0) {
            document.getElementById("iconeCarrinho").className =
                "bi bi-cart-fill fs-4";
        } else {
            document.getElementById("iconeCarrinho").className =
                "bi bi-cart fs-4";
        }
    }

    // ENVIAR LOGIN PARA A API

    document.getElementById("formLogin").addEventListener(
        "submit",
        async function(evento) {
            evento.preventDefault();

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;
            const mensagem = document.getElementById("mensagemLogin");

            mensagem.className = "text-muted";
            mensagem.textContent = "Verificando login...";

            const dadosLogin = {
                email: email,
                senha: senha
            };

            try {
                const resposta = await fetch(API_URL + "/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dadosLogin)
                });

                const dados = await resposta.json();

                if (resposta.status === 200 && dados.sucesso === true) {
                    const usuario = dados.usuario;

                    localStorage.setItem(
                        "usuarioLogado",
                        JSON.stringify(usuario)
                    );

                    window.location.href = "index.html";

                } else if (resposta.status === 400) {
                    mensagem.className = "text-danger";
                    mensagem.textContent =
                        "Informe o e-mail e a senha.";

                } else if (resposta.status === 401) {
                    mensagem.className = "text-danger";
                    mensagem.textContent =
                        "Usuário ou senha incorretos.";

                } else {
                    mensagem.className = "text-danger";
                    mensagem.textContent =
                        "Erro HTTP " + resposta.status;
                }

            } catch (erro) {
                mensagem.className = "text-danger";
                mensagem.textContent =
                    "Erro de conexão com a API.";
            }
        }
    );

    atualizarCabecalho();

</script>

</body>
</html>
