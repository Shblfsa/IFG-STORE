
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFG STORE - Início</title>
    <link rel="icon" href="favicon (1).ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="IFG.png" width="65" alt="Logo IFG">
                IFG STORE
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="produtos.html">Produtos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contato.html">Contato</a>
                    </li>
                </ul>

                <a href="carrinho.html" class="nav-link text-white me-4">
                    <i id="iconeCarrinho" class="bi bi-cart fs-4"></i>
                    <span id="contadorCarrinho" class="badge bg-danger">0</span>
                </a>

                <div class="dropdown">
                    <button class="btn btn-outline-light dropdown-toggle"
                            data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-4"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end"
                        id="menuUsuario"></ul>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1 class="text-center mb-4">Bem-vindo à IFG STORE</h1>

        <div id="carouselLoja" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselLoja"
                        data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#carouselLoja"
                        data-bs-slide-to="1"></button>
            </div>

            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="dell.png" class="d-block w-100 imagem-banner"
                         alt="Notebook Dell">
                </div>
                <div class="carousel-item">
                    <img src="computador.jpg" class="d-block w-100 imagem-banner"
                         alt="Notebook em promoção">
                </div>
            </div>

            <button class="carousel-control-prev" type="button"
                    data-bs-target="#carouselLoja" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
                <span class="visually-hidden">Anterior</span>
            </button>

            <button class="carousel-control-next" type="button"
                    data-bs-target="#carouselLoja" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
                <span class="visually-hidden">Próximo</span>
            </button>
        </div>

        <section class="text-center mt-5">
            <h2>Conheça nossos produtos</h2>
            <p>Confira nossos notebooks e escolha o ideal para você.</p>
            <a href="produtos.html" class="btn btn-success btn-lg">
                Ver produtos
            </a>
        </section>
    </main>

    <footer class="rodape bg-dark text-white text-center p-4 mt-auto">
        <p>Redes sociais:
            <a href="https://www.facebook.com/" class="text-white mx-2">Facebook</a>
            <a href="https://www.instagram.com/" class="text-white mx-2">Instagram</a>
            <a href="https://www.tiktok.com/" class="text-white mx-2">TikTok</a>
        </p>
        <p class="mb-0">&copy; 2026 IFG STORE</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function atualizarMenuUsuario() {
            let menu = document.getElementById("menuUsuario");
            let usuario = localStorage.getItem("usuarioLogado");

            if (usuario) {
                menu.innerHTML =
                    '<li><a class="dropdown-item" href="meus-dados.html">Meus Dados</a></li>' +
                    '<li><a class="dropdown-item" href="meus-pedidos.html">Meus Pedidos</a></li>' +
                    '<li><button class="dropdown-item" onclick="sair()">Sair</button></li>';
            } else {
                menu.innerHTML =
                    '<li><a class="dropdown-item" href="novo_usuario.html">Cadastrar</a></li>' +
                    '<li><a class="dropdown-item" href="login.html">Entrar</a></li>';
            }
        }

        function sair() {
            localStorage.removeItem("usuarioLogado");
            window.location.href = "index.html";
        }

        function atualizarCarrinho() {
            let carrinho = JSON.parse(localStorage.getItem("carrinho") || "[]");
            let quantidade = carrinho.reduce(function(soma, item) {
                return soma + item.quantidade;
            }, 0);

            document.getElementById("contadorCarrinho").textContent = quantidade;
            document.getElementById("iconeCarrinho").className =
                quantidade > 0 ? "bi bi-cart-fill fs-4" : "bi bi-cart fs-4";
        }

        atualizarMenuUsuario();
        atualizarCarrinho();
    </script>
</body>
</html>
